[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-agent"
version = "0.1.0"
description = "A lightweight AI agent framework with tool use, session management, and delegation"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    "httpx>=0.25",
    "Pillow>=10.0",
]

[project.optional-dependencies]
remote = ["paramiko>=3.0"]
datasets = [
    "huggingface_hub>=0.20",
    "kaggle>=1.6",
    "roboflow>=1.1",
]
detection = [
    "ultralytics>=8.0",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "numpy>=1.24",
    "onnx>=1.14",
]
all = [
    "paramiko>=3.0",
    "huggingface_hub>=0.20",
    "kaggle>=1.6",
    "roboflow>=1.1",
    "ultralytics>=8.0",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "numpy>=1.24",
    "onnx>=1.14",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
pico-agent = "pico.cli:main"

[tool.setuptools.packages.find]
include = ["pico*"]
